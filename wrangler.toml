name = "official-imam-syafii"
compatibility_date = "2026-09-29"

# CATATAN PENTING: JANGAN tambahkan `pages_build_output_dir` di sini.
# Kehadiran field itu membuat build git-integrated di dashboard Cloudflare
# berpindah ke mode "Workers with assets" dan BERHENTI mendeteksi folder
# functions/ sama sekali (termasuk functions/berita/[id].js yang sudah lama
# ada) -> semua route Functions jatuh ke fallback SPA (index.html), 404 diam-diam.
# File ini HANYA dipakai untuk resource CLI lokal (wrangler d1/r2 execute,
# wrangler pages dev) -- binding produksi tetap diatur lewat dashboard
# (Settings -> Bindings), bukan dari file ini.

# Setelah menjalankan `npx wrangler d1 create sekolah-db` (lihat d1/README.md),
# tempel "database_id" dari output perintah itu ke bawah ini.
[[d1_databases]]
binding = "DB"
database_name = "sekolah-db"
database_id = "281a63d7-059a-405e-8c3f-9abf8dc2e070"

# Aktif setelah R2 diaktifkan di dashboard Cloudflare + `npx wrangler r2 bucket create sekolah-uploads`.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "sekolah-uploads"
