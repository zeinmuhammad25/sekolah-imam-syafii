name = "official-imam-syafii"
compatibility_date = "2026-09-29"

# CATATAN PENTING (dari pengalaman nyata, bukan dugaan):
# Build git-integrated di dashboard Cloudflare TETAP MEMBACA file ini untuk
# mencoba memasang binding [[d1_databases]] / [[r2_buckets]] / dst saat publish
# Functions -- bukan cuma untuk CLI lokal seperti dugaan awal. Kalau salah SATU
# binding di sini menunjuk resource yang belum ada (mis. bucket R2 yang belum
# dibuat), SELURUH proses publish Functions gagal diam-diam (deployment tetap
# tercatat "Active", tapi tanpa satu pun Functions berjalan -- termasuk
# functions/berita/[id].js yang sudah lama live).
#
# ATURAN: setiap blok binding di bawah HANYA boleh ada di sini setelah resource
# aslinya benar-benar dibuat di Cloudflare (wrangler d1 create / r2 bucket create).
# Kalau belum, hapus/komentari bloknya dulu -- jangan biarkan menunjuk ke sesuatu
# yang belum ada.

# Setelah menjalankan `npx wrangler d1 create sekolah-db` (lihat d1/README.md),
# tempel "database_id" dari output perintah itu ke bawah ini.
[[d1_databases]]
binding = "DB"
database_name = "sekolah-db"
database_id = "281a63d7-059a-405e-8c3f-9abf8dc2e070"

# NONAKTIF SEMENTARA -- bucket "sekolah-uploads" belum dibuat (R2 belum diaktifkan
# di akun ini). Blok ini menunjuk resource yang belum ada, yang membuat SELURUH
# publish Functions gagal diam-diam saat deploy. Aktifkan lagi (hapus komentar)
# HANYA setelah `npx wrangler r2 bucket create sekolah-uploads` berhasil.
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "sekolah-uploads"
